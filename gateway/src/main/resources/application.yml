server:
  port: 8082
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: wallet-service
          uri: lb://wallet-service
          predicates:
              - Path=/api/wallets/**
        - id: payflow-service
          uri: lb://payflow-service
          predicates:
              - Path=/api/**

